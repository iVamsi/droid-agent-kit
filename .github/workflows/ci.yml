name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Windows runners default to pwsh, where `./gradlew` (a shell script) does not run at all.
# GitHub-hosted Windows images ship Git Bash, so making bash the default everywhere keeps one
# set of commands working on all three OSes instead of branching per platform.
defaults:
  run:
    shell: bash

jobs:
  # Fast lane: the checks that only need to run once. Kept off the OS matrix so a formatting
  # nit fails in one place rather than three.
  static:
    name: Lint, static analysis, coverage
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure build inputs are intact
        run: |
          set -euo pipefail
          if [ "$(wc -l < gradle/verification-metadata.xml)" -lt 100 ] || \
             [ "$(wc -l < mcp-server/src/main/kotlin/com/droidagentkit/mcp/DroidAgentMcpDispatcher.kt)" -lt 50 ]; then
            echo "Build inputs look truncated. Restore with scripts/restore-verification-metadata.sh" \
              "and regenerate DroidAgentMcpDispatcher.kt from source history." >&2
            exit 1
          fi
      - name: Public repository hygiene
        run: bash scripts/check-public-hygiene.sh
      - name: Lint
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck --no-configuration-cache --stacktrace
      - name: Static analysis
        run: ./gradlew detekt --no-configuration-cache --stacktrace
      # Per-module rather than one project-wide average, which can stay healthy while a single
      # module rots. toolbox-core's rule is the strictest: it is filtered to the classes that
      # decide authority, so security-critical code cannot lose coverage behind a healthy mean.
      - name: Coverage
        run: |
          ./gradlew :toolbox-core:koverVerify :mcp-server:koverVerify :android-device-core:koverVerify \
            :android-inspector:koverVerify :auditor-cli:koverVerify --no-configuration-cache --stacktrace

  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    # Blocking on all three OSes. They started advisory while the failures they surfaced were
    # fixed -- a POSIX-only test fixture class, a toolchain the Windows image lacks, and two
    # assertions that hardcoded POSIX path separators -- and all three are green now, so a
    # regression should fail the build rather than be quietly tolerated.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["17", "21"]
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      # Both versions, not just the matrix one: the build pins jvmToolchain(17), and the Windows
      # runner image has no preinstalled JDK 17 for Gradle to auto-detect, so the JDK 21 leg failed
      # to resolve a toolchain at all. Linux and macOS images happen to ship 17, which is why this
      # only showed up on Windows.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}
      - name: Test
        run: ./gradlew test --no-configuration-cache --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: "**/build/reports/tests/**"
          retention-days: 7

  # Proves the artifact users actually install works: the npm launcher fetches and verifies the
  # jar, then speaks a real MCP initialize round-trip over stdio.
  smoke:
    name: Launcher smoke + stdio E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
      DROIDAGENT_E2E: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Smoke test (fetch, verify, stdio initialize)
        run: |
          chmod +x gradlew
          bash distribution/smoke-test.sh

  # Drives the built CLI against the checked-in sample projects. The inspector and auditor are
  # static parsers, so this needs no Android SDK -- cheap enough to run on every PR.
  samples:
    name: CLI against sample projects
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build CLI
        run: |
          chmod +x gradlew
          ./gradlew :cli:installDist --no-configuration-cache --stacktrace
      - name: Exercise samples
        run: bash scripts/ci-samples-check.sh

  # Builds the MCPB bundle on every PR. It is only exercised at release time otherwise, which is
  # the worst moment to discover the manifest stopped validating.
  mcpb:
    name: MCPB bundle builds and validates
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      # Built first: the round-trip below points DROIDAGENT_BIN at it, so the bundle exercises a
      # real server instead of trying to fetch a release jar that may not exist for this version.
      - name: Build CLI
        run: |
          chmod +x gradlew
          ./gradlew :cli:installDist --no-configuration-cache --stacktrace
      - name: Build and validate bundle
        run: bash scripts/build-mcpb.sh
      - name: Bundle entry point speaks MCP
        env:
          DROIDAGENT_BIN: ${{ github.workspace }}/cli/build/install/droidagent/bin/droidagent
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts | head -n1)"
          npx -y @anthropic-ai/mcpb@2.1.2 unpack \
            "build/distribution/android-agent-kit-${version}.mcpb" build/mcpb-unpacked
          # A bundle that packs but whose entry point cannot answer initialize is worthless, and
          # nothing else in CI would notice.
          node distribution/test-fixtures/stdio-initialize.js build/mcpb-unpacked/server/index.js 30000

  # Catches version drift and packaging breakage at PR time instead of at tag time, when the
  # release workflow is already running and half the artifacts are published.
  release-readiness:
    name: Release surface dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Version consistency across every hardcoded copy
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts | head -n1)"
          echo "Declared version: $version"
          bash scripts/check-release-version.sh "$version"
      - name: npm launcher packs cleanly
        working-directory: distribution/npm-launcher
        run: npm pack --dry-run
