name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assemble testClasses --no-configuration-cache --stacktrace

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
