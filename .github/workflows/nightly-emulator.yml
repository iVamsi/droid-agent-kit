name: Nightly emulator E2E

# Device tools are mocked everywhere else in the suite, which proves the parsing and the
# authorization but never that the adb invocations themselves are right. This is the only place a
# real device answers. It runs nightly rather than per-PR because booting an AVD costs minutes.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  emulator:
    name: Drive the MCP server against a real emulator
    # ubuntu-latest exposes KVM, without which the emulator is too slow to be useful.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build CLI
        run: |
          chmod +x gradlew
          ./gradlew :cli:installDist --no-configuration-cache --stacktrace

      # Pinned by version and checksum like every other artifact this repo fetches. Without it the
      # e2e skips the Perfetto analysis rather than failing, so a dead URL degrades coverage instead
      # of breaking the nightly.
      - name: Provision Trace Processor
        id: trace-processor
        continue-on-error: true
        env:
          TP_VERSION: v57.2
          TP_SHA256: 55ba613fc6d4f71df81eee2dbfc293020063655c241b3e314bff75345b802684
        run: |
          set -euo pipefail
          url="https://commondatastorage.googleapis.com/perfetto-luci-artifacts/${TP_VERSION}/linux-amd64/trace_processor_shell"
          curl -sfL --retry 3 -o /tmp/trace_processor_shell "$url"
          echo "${TP_SHA256}  /tmp/trace_processor_shell" | sha256sum -c -
          chmod +x /tmp/trace_processor_shell
          echo "DAK_TRACE_PROCESSOR=/tmp/trace_processor_shell" >> "$GITHUB_ENV"

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: DAK_TRACE_PROCESSOR="${DAK_TRACE_PROCESSOR:-}" bash scripts/e2e-emulator.sh

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-e2e-api${{ matrix.api-level }}
          path: |
            build/droidagentkit/**
            /tmp/dak-e2e/**
          retention-days: 7
