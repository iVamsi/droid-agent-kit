name: Nightly emulator E2E

# Device tools are mocked everywhere else in the suite, which proves the parsing and the
# authorization but never that the adb invocations themselves are right. This is the only place a
# real device answers. It runs nightly rather than per-PR because booting an AVD costs minutes.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  emulator:
    name: Drive the MCP server against a real emulator
    # ubuntu-latest exposes KVM, without which the emulator is too slow to be useful.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build CLI
        run: |
          chmod +x gradlew
          ./gradlew :cli:installDist --no-configuration-cache --stacktrace

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/e2e-emulator.sh

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-e2e-api${{ matrix.api-level }}
          path: |
            build/droidagentkit/**
            /tmp/dak-e2e/**
          retention-days: 7
