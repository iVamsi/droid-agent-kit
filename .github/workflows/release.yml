name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Recovery path: when one job fails the others are skipped, and re-tagging an already-published
  # version is not possible. This allows re-running the registry publish for an existing tag.
  workflow_dispatch:
    inputs:
      registry_only:
        description: "Only publish to the MCP registry (for an already-released tag)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify version consistency
    # Push-only: it derives the expected version from the tag name, which does not exist on a
    # dispatch. The dispatch path publishes distribution/server.json exactly as committed.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check every hardcoded version string matches the tag
        run: bash scripts/check-release-version.sh "${GITHUB_REF_NAME#v}"

  build-and-release:
    if: github.event_name == 'push'
    name: Build fat jar and publish GitHub Release
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build fat jar
        run: |
          chmod +x gradlew
          ./gradlew :cli:shadowJar --no-configuration-cache --stacktrace
      - name: Checksum
        working-directory: cli/build/libs
        run: |
          set -euo pipefail
          jar="droidagent-cli-${GITHUB_REF_NAME#v}.jar"
          shasum -a 256 "$jar" > "$jar.sha256"
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          chmod +x scripts/generate-sbom.sh
          bash scripts/generate-sbom.sh "$version" "cli/build/libs/droidagent-cli-${version}.cdx.json"
      - name: Build MCPB bundle
        run: |
          set -euo pipefail
          bash scripts/build-mcpb.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "cli/build/libs/droidagent-cli-${version}.jar" \
            "cli/build/libs/droidagent-cli-${version}.jar.sha256" \
            "cli/build/libs/droidagent-cli-${version}.cdx.json" \
            "build/distribution/android-agent-kit-${version}.mcpb" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  publish-npm:
    if: github.event_name == 'push'
    name: Publish npm launcher (OIDC trusted publishing)
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: distribution/npm-launcher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1; pin/upgrade explicitly rather than trusting
      # whatever setup-node's cached Node 22 build happens to bundle.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Decide dist-tag
        id: disttag
        working-directory: ${{ github.workspace }}
        run: bash scripts/npm-dist-tag.sh "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publish
        # One command, one tag. A follow-up `npm dist-tag add` cannot work here: OIDC trusted
        # publishing mints a credential scoped to `npm publish` alone, so any second registry call
        # fails with E401 -- and it fails *after* the package is already published, leaving the
        # release half-done.
        run: npm publish --access public --tag "${{ steps.disttag.outputs.tag }}"

  publish-mcp-registry:
    name: Publish to MCP registry (OIDC)
    needs: publish-npm
    if: always() && (needs.publish-npm.result == 'success' || inputs.registry_only == true)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: "1.8.0"
      # SHA-256 of mcp-publisher_linux_amd64.tar.gz for this version, from
      # https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/registry_1.8.0_checksums.txt
      MCP_PUBLISHER_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -sSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Login via GitHub Actions OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP registry
        run: |
          set -euo pipefail
          # The registry verifies ownership via the npm package's `mcpName` field, which needs
          # the just-published npm version to be resolvable; retry a few times in case of
          # npm registry read-replica propagation lag (observed to take a few minutes once).
          for attempt in 1 2 3; do
            if ./mcp-publisher publish distribution/server.json; then
              exit 0
            fi
            echo "mcp-publisher publish attempt $attempt failed, retrying in 20s..." >&2
            sleep 20
          done
          echo "mcp-publisher publish failed after 3 attempts" >&2
          exit 1

  # Delegates to the reusable workflow so the release path and the on-demand path cannot drift.
  homebrew-formula:
    if: github.event_name == 'push'
    name: Update Homebrew tap
    needs: build-and-release
    uses: ./.github/workflows/homebrew-tap-sync.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
